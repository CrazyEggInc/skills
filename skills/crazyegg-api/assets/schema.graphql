"""
Export request returned by `createAiExport`, `aiExport`, and `aiExports`. Generation and notification states are
independent; completed exports expire 30 days after completion.
"""
type AiExport {
  id: Int!

  "Generation state: pending, running, completed, or failed; retryable failures return to pending."
  status: String!

  "Inclusive exported window start in Unix seconds, aligned to UTC midnight."
  startAt: Int!

  "Exclusive exported window end in Unix seconds, aligned to UTC midnight."
  endAt: Int!

  "Selected feature strings: HEATMAPS, RECORDINGS, SURVEYS, or WEB_ANALYTICS."
  features: [String!]!

  "Email address supplied for the completion notification."
  notificationEmail: String!

  "Notification state: pending, sent, unconfirmed after a delivery claim, or not sent for a failed export."
  notificationStatus: String!

  "Request creation timestamp as an ISO 8601 UTC string."
  createdAt: String!

  "Download expiry as an ISO 8601 UTC string, 30 days after completion; null before completion."
  expiresAt: String

  """
  Most recent generation failure text; null when no error is recorded. A pending request may retain a retryable
  error.
  """
  error: String

  """
  Temporary download URL, valid for up to 900 seconds or remaining export lifetime. Null unless completed with an
  unexpired file.
  """
  downloadUrl: String
}

"""
Site-data export settings for `createAiExport`. Dates must be UTC midnights, ordered, and no more than 90 days
apart.
"""
input AiExportInput {
  "Site ID from `sites`; requires site access and view access for every selected feature."
  siteId: Int!

  "Inclusive Unix seconds at UTC midnight; must not be in the future and must precede `endAt`."
  startAt: Int!

  """
  Exclusive Unix seconds at UTC midnight; after `startAt`, at most 90 days later, and no more than 24 hours
  beyond now.
  """
  endAt: Int!

  """
  Nonempty list of distinct, case-sensitive strings: HEATMAPS, RECORDINGS, SURVEYS, WEB_ANALYTICS. Web analytics
  must fall within available history.
  """
  features: [String!]!

  "Completion-notification email, trimmed before validation; at most 254 bytes and must contain a valid address."
  notificationEmail: String!
}

"""
A/B test settings and lifecycle returned by test lists, detail queries, and create/update operations.
Metrics are populated by list queries; use `abTestResultCounts` for goal/date-scoped results.
"""
type AbTest {
  id: Int!

  "Whether automatic traffic reweighting is enabled; null only if no stored value is present."
  autoReweight: Boolean

  "Id of the site that owns the test, as listed by `sites`."
  siteId: Int!

  name: String!

  "Saved effective device set used for test execution."
  devices: [SnapshotDevice!]!

  "Current lifecycle state: DRAFT, RUNNING, STOPPED, or DELETED; a missing stored status is reported as DELETED."
  status: AbTestStatus!

  "Normalized source page URL used to capture and preview variants."
  pageUrl: String!

  "Stored URL matching pattern, falling back to `pageUrl` when none is set."
  matchingUrl: String

  "Signed control-variant thumbnail URL; null when no control variant or asset path is available."
  thumbnailUrl: String

  "Signed control-variant screenshot URL; null when no control variant or asset path is available."
  screenshotUrl: String

  "PATCH changes page elements; SPLIT redirects visitors to variant URLs."
  type: AbTestType!

  "Primary goal when loaded and on the same site; null when no accessible matching goal is linked."
  goal: AbTestGoal

  "Primary goal for `abTestResultDetail`; null in test lists, editor details, and create/update responses."
  selectedGoal: AbTestGoal

  "Loaded variants, including retired variants; empty when variant data is not loaded."
  variants: [AbTestVariant!]

  "Count of variants including retired variants; null when result processing has not populated the count."
  variantsCount: Int

  """
  JSON-encoded string of the wizard inputs last saved by `abTestCreate`, `abTestUpdate`, or `abTestUpdateDraft`: the
  input fields except `variants`, with snake_case keys, including the unsaved `goal` form and `notes`. Duplicates
  hold a reduced copy of the settings; a test without a draft returns the string `null`.
  """
  draft: String

  "Audience JSON value, not a JSON-encoded string; null targets everyone. See `audienceDefinitionContract`."
  audienceDefinition: JSON

  "Source test id for a duplicate; null when no source test is recorded."
  originalId: Int

  "Test notes set by `abTestUpdateNotes`; null when none. Notes sent in create or update inputs are only in `draft`."
  notes: String

  "Goals with recorded conversions for this test; empty in lists and detail queries, which do not load them."
  conversionGoals: [AbTestGoal]

  "Unique test visitors in the loaded metrics; null when metrics have not been loaded."
  totalVisitors: Int

  "Converted visitors for the primary goal in the loaded metrics; null when metrics have not been loaded."
  totalConversions: Int

  "Not populated by current A/B test queries; null."
  totalViews: Int

  """
  Conversions divided by visitors as percent, rounded to two decimals; zero with no visitors, null without
  metrics.
  """
  avgConversionRate: Float

  "Conversion value in ten-thousandths of `displayCurrency`; zero when metrics or recorded amounts are absent."
  totalValue: AbTestValue

  """
  Seconds the test has run, from publication (or creation) to its stop or deletion time, or to now while running;
  null for a never-published DRAFT.
  """
  duration: Int

  "Whether loaded metrics have at least one visitor; false when metrics are not loaded."
  hasResults: Boolean!

  """
  Id of the non-retired variant, control included, with the highest non-zero conversion rate; null on a tie, without
  conversions, or when results are not loaded.
  """
  bestVariantId: Int

  "Variant identified by `bestVariantId`; null if the highest conversion rate is tied or metrics are not loaded."
  bestVariant: AbTestVariant

  "Creation time in Unix seconds."
  createdAt: Int!

  "Publication time in Unix seconds; null until the test has been published."
  publishedAt: Int

  "Stop time in Unix seconds; null until the test has been stopped."
  stoppedAt: Int

  "Creator details; missing user records fall back to the saved id/name, which may be null."
  createdBy: User

  "Publisher details; saved id/name may be null before publication or for older records."
  publishedBy: User

  "Saved creator user id; null when no creator id was recorded."
  createdByUserId: Int @deprecated(reason: "Use created_by instead")

  "Deprecated creator name; current test payloads do not populate this field."
  createdByUserName: String @deprecated(reason: "Use created_by instead")

  "Whether the test is known to be installed on the site; becomes true once the test records a visitor."
  scriptInstalled: Boolean!

  "Whether creation was less than two days ago."
  recentlyCreated: Boolean!

  "Viewer-specific action flags; mutations enforce their own access and lifecycle checks."
  permissions: AbTestPermissions!

  """
  Overall chi-square significance, 0-100 percent; null without metrics, visitors, a control, or VARIANT
  comparison.
  """
  significance: Float
}

