schema {
  subscription: RootSubscriptionType
  mutation: RootMutationType
  query: RootQueryType
}

type RootQueryType {
  """
  Returns the A/B test inbox as a cursor-based list with optional site, status, and search
  filters; visitor sorting is computed from merged results data rather than the base record.
  """
  abTestList(
    site: Int
    cursor: String
    limit: Int
    search: String
    status: AbTestStatus
    order: AbTestListOrder
  ): AbTestsListMeta!

  "Returns lightweight A/B test and variant references for selectors."
  abTestRefList(site: Int!): [AbTestRef!]!

  """
  Returns the dashboard-focused A/B test inbox as a cursor-based list with optional site,
  status, and search filters.
  """
  abTestDashboardList(
    site: Int
    cursor: String
    limit: Int
    search: String
    status: AbTestStatus
    order: AbTestListOrder
  ): AbTestsListMeta!

  """
  Returns the most recent non-draft A/B tests for the active site context, defaulting to 3
  items when no explicit limit is provided.
  """
  abTestHomeRecent(site: Int, limit: Int): [AbTest!]!

  """
  Returns a page-based A/B test list for flows that need numbered pagination, including shared
  goal views; `goal_id` filters the list and the date arguments scope the attached results data.
  """
  abTestListPaginated(
    site: Int
    limit: Int
    goalId: Int
    startDate: Int
    endDate: Int
    page: Int!
  ): AbTestsListPaginatedMeta!

  "Returns the editor-focused A/B test payload without loading result metrics."
  abTestEditorDetail(id: Int!): AbTest!

  """
  Returns static/structural result-page data for an A/B test, including the canonical default
  selected goal but excluding filter-scoped metrics.
  """
  abTestResultDetail(id: Int!): AbTest!

  """
  Returns goal/date/order-scoped result metrics for an A/B test using a normalized per-variant
  counts shape.
  """
  abTestResultCounts(
    id: Int!
    goalId: Int!
    startDate: Int
    endDate: Int
    order: AbTestVariantOrder
  ): AbTestResultCounts!

  """
  Returns conversion distribution buckets for a specific test and goal; the requested dates are
  normalized against the test's available runtime before aggregation.
  """
  abTestDistribution(id: Int!, goalId: Int!, startDate: Int, endDate: Int, timeUnit: TimeUnit!): [AbTestDistribution!]!

  """
  Returns aggregate inbox counts by A/B test status for the current viewer, optionally scoped to
  one site.
  """
  abTestStatusCounts(site: Int): AbTestStatusCountsResult!

  """
  Returns the current viewer profile plus session-scoped account data such as surveys, accounts,
  and subscriptions.
  """
  me: MeDetails

  """
  Returns API credentials for the current user, creating them on first access when the user can
  manage the API.
  """
  api: ApiKeys

  """
  Container for tracking-option fields like `current_ip` and `user_blocked_ips`; request nested
  fields to resolve values.
  """
  options: Options

  """
  Returns session state derived from the request context, including admin impersonation and
  shared-resource access.
  """
  sessionInfo: SessionInfo

  """
  Returns onboarding tasks with dependency slugs, completion status, and the permission gate
  needed for each task.
  """
  gettingStarted: [GettingStarted]

  """
  Returns the saved billing profile for the current user, including sanitized payment details
  and company addresses.
  """
  billingDetails: BillingDetails

  """
  Returns email notification preferences merged with default values so every supported
  notification is always present.
  """
  userNotifications: UserNotifications

  "Returns a fresh interagent JWT for the current session."
  interagentJwt: InteragentJwt

  adsLibraryPreviewHeader(siteId: Int!): AdPerformanceHeader

  adsLibraryPreviewAdPreview(siteId: Int!, adId: Int!): AdPerformanceAdPreviewPayload

  adsLibraryPreviewPerformance(
    siteId: Int!
    startAt: Int
    endAt: Int
    presetDate: String
    platforms: [AdPlatformSource!]
    campaignIds: [Int!]
    adGroupIds: [Int!]
    adIds: [Int!]
    goalId: Int
    dataMode: AdPerformanceDataMode
    attributionModel: AdPerformanceAttributionModel
    conversionWindowDays: Int
  ): AdPerformance

  adPerformanceHeader(siteId: Int!): AdPerformanceHeader

  adPerformanceAdPreview(siteId: Int!, adId: Int!): AdPerformanceAdPreviewPayload

  adPerformance(
    siteId: Int!
    startAt: Int
    endAt: Int
    presetDate: String
    platforms: [AdPlatformSource!]
    campaignIds: [Int!]
    adGroupIds: [Int!]
    adIds: [Int!]
    goalId: Int
    dataMode: AdPerformanceDataMode
    attributionModel: AdPerformanceAttributionModel
    conversionWindowDays: Int
  ): AdPerformance

  adPerformanceAdTree(siteId: Int!): AdPerformanceAdTreePayload

  """
  Returns paginated surveys and CTAs visible to the current session, auto-narrowing the type
  filter when the viewer only has one addon capability.
  """
  addonList(siteId: Int, cursor: String, filter: AddonFilter!): AddonListMeta!

  """
  Returns one addon by id, including soft-deleted records when the request originates from
  linked parent resolvers such as audit trail entries.
  """
  addonDetail(id: String!): Addon

  """
  Returns the current JSON Schema contract and a representative content example for a Survey
  or CTA. The revision identifies the exact vendored schema set used by mutation validation.
  """
  addonContentContract(type: AddonType!): AddonContentContract!

  """
  Returns the shared survey and CTA template catalog plus a top-level `can_manage` flag;
  template management itself is restricted to addon template managers.
  """
  addonTemplatesList: AddonTemplateListMeta!

  """
  Returns one template by id or `null` when the template does not exist instead of raising a
  not-found error.
  """
  addonTemplateDetail(id: Int!): AddonTemplate

  """
  Returns one suggestion and marks it as clicked when it is still in an eligible suggestion
  lifecycle state.
  """
  addonSuggestionDetail(id: Int!): AddonSuggestion

  """
  Returns recent suggestions for a site and marks them as viewed; `limit` defaults to 3 when
  omitted.
  """
  addonSuggestionsList(type: AddonSuggestionType!, siteId: Int!, limit: Int): [AddonSuggestion]!

  """
  Returns aggregate counts keyed by addon status after applying the same site and capability
  filters used by addon list queries.
  """
  addonStatusCounts(site: Int, type: AddonType): AddonStatusCountsResult!

  """
  Returns the analytics dashboard for a site or GA property. Requires the web analytics view
  capability, a date range, and only resolves the nested metric fields you request.
  """
  analytics(
    sourceId: Int!
    sourceType: AnalyticsSource!
    searchTerm: String
    startAt: Int
    endAt: Int
    presetDate: String
    orderBy: OrderColumn
    orderDir: OrderDir
    cursor: AnalyticsCursorArg
    numSegments: Int
    granularity: TimeUnit
  ): Analytics

  """
  Returns one ranked analytics dimension with its own cursor. The response normalizes the
  selected dimension into the `dimension` field instead of echoing the dimension name in the
  payload.
  """
  analyticsDimension(
    dimension: AnalyticsDimension!
    sourceId: Int!
    sourceType: AnalyticsSource!
    searchTerm: String
    startAt: Int
    endAt: Int
    presetDate: String
    limit: Int
    orderBy: OrderColumn
    orderDir: OrderDir
    cursor: AnalyticsCursorDataArg
    numSegments: Int
  ): AnalyticsSingle

  """
  Returns over-time results under the requested dimension field only. Sibling aggregate fields are
  null; request totals such as `pageViews` from `analytics` instead.
  """
  analyticsOverTime(
    dimension: AnalyticsDimension!
    metric: AnalyticsMetric!
    sourceId: Int!
    sourceType: AnalyticsSource!
    startAt: Int
    endAt: Int
    presetDate: String
    numSegments: Int
    granularity: TimeUnit
    goalId: Int
  ): Analytics

  """
  Returns per-day goal conversions for the requested source and date range. Unlike `analytics`,
  this query only returns the conversion series and does not include dashboard metrics.
  """
  analyticsConversionsOverTime(
    goalId: Int!
    sourceId: Int!
    sourceType: AnalyticsSource!
    startAt: Int
    endAt: Int
    presetDate: String
    granularity: TimeUnit
  ): [ConversionDay!]!

  """
  Returns the first enabled admin announcement; disabled records are hidden and absence resolves
  to `null`.
  """
  announcement: AnnouncementDetails

  """
  Returns a mixed audit log feed for the current session. Access requires the `audit_log:view`
  capability, and some requested action types such as billing or install are satisfied by
  matching `internal_url_visited` records behind the scenes.
  """
  auditableActionList(filter: AuditableActionListFilter!, cursor: String): AuditableActionListResults

  """
  Returns the viewer's billing-history feed behind the `billing:nav` capability gate, including
  a synthetic `Created Account` row and cursor pagination that advances by already-seen ids.
  """
  paymentTransactionList(cursor: String, limit: Int, order: PaymentTransactionListOrder): PaymentTransactionListMeta

  """
  Returns one payment transaction for the current viewer under the same `billing:nav` permission
  gate; ids are scoped to the authenticated user and missing rows resolve as not found.
  """
  paymentTransaction(id: Int!): PaymentTransaction!

  pricingGrid: PricingGridResult!

  """
  The pricing experience for the viewer, chosen server-side from their current plan
  family: `ANALYTICS_GROWTH` returns the Analytics/Growth plan cards + comparison
  table; `LEGACY` returns empty lists and the shell falls back to `pricingGrid`.
  """
  pricingExperience: PricingExperienceResult!

  """
  Previews the prorated amount due now for an in-app subscription change so the
  UI can confirm the cost before applying it. `requires_checkout` is true when
  there is no active Stripe subscription (the change routes to Checkout, which
  shows the price on Stripe's own page) — in that case the amount fields are null.
  """
  previewSubscriptionUpdate(planPriceId: String!): SubscriptionUpdatePreview!

  """
  The viewer's primary card on file (single-card model). Null when there is no
  card — the checkout UI then falls back to collecting one. The payment method
  id is intentionally not exposed.
  """
  defaultPaymentMethod: DefaultPaymentMethod

  """
  Every `pricing_table` plan with its per-tier prices (page-views/recordings
  volume, price, stripe id) and the matching `$0` companion price ids, so the
  shell can render the tier picker and build the cart. Optional `ab_test`
  narrows to an A/B variant ("a"/"b"); omitted returns all pricing_table plans.
  """
  tieredPricingPlans(abTest: String): [TieredPricingPlan!]!

  """
  Up to three all-time usage totals for the viewer's account, in the order the cancellation flow
  should show them. Totals are account-wide and not filtered by site; display names, captions and
  number formatting live in the shell.
  """
  cancellationMetrics: [CancellationMetric!]!

  brandGuideline(siteId: Int!): BrandGuideline @deprecated(reason: "Use siteAsset with type BRAND_GUIDELINES")

  brandGuidelineRevisions(siteId: Int!, beforeRevision: Int, limit: Int): [BrandGuideline!]!
    @deprecated(reason: "Use siteAssetRevisions with type BRAND_GUIDELINES")

  siteAssets(siteId: Int!): [SiteAsset!]

  siteAsset(siteId: Int!, type: SiteAssetType!): SiteAsset

  siteAssetRevisions(siteId: Int!, type: SiteAssetType!, beforeRevision: Int, limit: Int): [SiteAsset!]

  """
  Returns only the top-level capability fields requested in the selection set, so omitted
  capabilities are never computed or included.
  """
  capabilities: Capabilities

  """
  Returns the snapshots-backed subscription summary that the shell uses for high-level plan
  state, expiries, and platform metadata.
  """
  subscription: CapabilitySubscription

  """
  Returns changelog events visible to the logged-in session after applying feature-flag,
  payment-plan, script-version, and publish-date filters; `new_only` limits results to the last
  12 months.
  """
  changelog(newOnly: Boolean): [ChangelogEvent!]!

  """
  Returns notification channels for a site the current session can access, optionally filtered
  by type and sorted by a derived destination value rather than raw setup_data.
  """
  channelsList(siteId: Int!, type: ChannelType, order: ChannelListOrder): [Channel!]!

  """
  Returns per-day CTA metrics for one CTA addon across an inclusive Unix-timestamp date range;
  requires the `ctas:view` capability and also works for allowed shared sessions.
  """
  ctaResult(id: ID!, startAt: Int!, endAt: Int!): CtaResults!

  """
  Returns the home-dashboard aggregate for one accessible site. The resolver requires the
  `home:view` capability, validates `site_id` against the current session, and compares the
  requested window against the provided previous window.
  """
  dashboard(siteId: Int!, startAt: Int!, endAt: Int!, previousStartAt: Int!, previousEndAt: Int!): Dashboard!

  """
  Returns one recorded error occurrence for a site. Access is gated by the errors-view
  capability, and some session-derived fields may be redacted when the related recording is
  outside the viewer's retention window.
  """
  error(id: String!, siteId: Int!): Error

  """
  Returns the aggregated error summary keyed by fingerprint MD5, including the current workflow
  status tracked on the summary record rather than on individual occurrences.
  """
  uniqueError(fingerprintMd5: String!, siteId: Int!): UniqueError

  """
  Returns timeframe-scoped metrics for one fingerprint MD5. When the fingerprint exists but has
  no occurrences in the requested window, the resolver still returns a zeroed stats object
  instead of `null`.
  """
  uniqueErrorStats(fingerprintMd5: String!, siteId: Int!, startAt: Int!, endAt: Int!): UniqueErrorStats

  """
  Returns the total number of individual error occurrences for one fingerprint within the
  requested timeframe. This mirrors `error_list` filtering without returning the paged records.
  """
  errorListTotal(siteId: Int!, fingerprintMd5: String!, startAt: Int!, endAt: Int!): Int!

  """
  Returns a page-number based list of individual occurrences for one fingerprint. Results
  include per-occurrence permissions that determine whether the linked recording can still be
  viewed or upgraded into view.
  """
  errorList(
    siteId: Int!
    fingerprintMd5: String!
    order: ErrorsOrder!
    limit: Int!
    page: Int!
    startAt: Int!
    endAt: Int!
    search: String
  ): ErrorListResults

  """
  Returns the aggregated error list grouped by fingerprint MD5. Pagination is cursor-based, and
  the cursor encodes already-seen fingerprint IDs instead of a numeric page offset.
  """
  uniqueErrorList(
    siteId: Int!
    order: UniqueErrorsOrder!
    limit: Int!
    startAt: Int!
    endAt: Int!
    status: ErrorStatusEnum!
    cursor: String
    search: String
  ): UniqueErrorListResults

  """
  Returns rollup stats for the same filters used by `unique_error_list`, keyed to the current
  status bucket and optional search term rather than to one specific fingerprint.
  """
  uniqueErrorListStats(
    siteId: Int!
    startAt: Int!
    endAt: Int!
    status: ErrorStatusEnum!
    search: String
  ): UniqueErrorListStatsResults

  """
  Returns the note timeline for one fingerprint. The resolver appends a synthetic first entry
  representing the initial unresolved status so consumers can render the full status history
  from first occurrence onward.
  """
  uniqueErrorNotes(fingerprintMd5: String!, siteId: Int!): [UniqueErrorNote!]!

  """
  Returns the current user's folders for one site and folder type; results are
  permission-filtered to allowed sites and sorted case-insensitively by title.
  """
  folders(filter: FolderListFilter!): FolderList

  """
  Returns one snapshots folder by id for the current user; access is restricted to snapshot
  folders on sites the session can view.
  """
  folder(id: Int!): Folder

  """
  Returns funnels the current session can view, optionally scoped to one site. Results use an
  opaque cursor that accumulates seen ids for infinite scroll, and omitted `site_id` excludes
  funnels from deleted sites.
  """
  funnelList(cursor: String, limit: Int, siteId: Int, search: String, order: FunnelListOrder): FunnelListMeta!

  """
  Returns one funnel by id for normal or shared sessions. Shared links only resolve their own
  funnel and record a view when accessed successfully.
  """
  funnelDetail(id: Int!): Funnel

  """
  Returns every accessible funnel on the site that references any of the requested goals. Access
  is gated by goal-view permission rather than funnel-view permission.
  """
  funnelsUsingGoals(siteId: Int!, goalIds: [Int!]!, order: FunnelListOrder): [Funnel!]!

  """
  Returns funnel counts and conversion rates for the requested site and range. Access requires
  funnel view permission, validates every non-visit step against the site, and includes both an
  overall summary and the same funnel broken down by the requested time unit.
  """
  funnelResult(siteId: Int!, startAt: Int!, endAt: Int!, timeUnit: TimeUnit!, steps: [FunnelStep!]!): FunnelQueryResult!

  """
  Returns Google Analytics properties visible to the current session; shared sessions and
  restricted-site sessions resolve to an empty list instead of partial account data.
  """
  gaProperties: [GaProperty]

  """
  Returns a cursor-paginated goal list with recent 7-day conversion/session metrics, including
  today; conversion sorting uses that same recent window instead of all-time data.
  """
  goalListSummary(site: Int, search: String, cursor: String, limit: Int, order: GoalListOrder): GoalSummaryListMeta!

  """
  Returns lightweight active goals for selectors and references; values like `has_value` are
  derived from preloaded triggers rather than a persisted flag.
  """
  goalRefList(site: Int): [GoalRef!]!

  """
  Returns selector-oriented goals with lightweight trigger payloads so clients can inspect
  linked trigger filters without fetching full goal details.
  """
  goalSelectorList(site: Int, search: String): [GoalLinked!]!

  """
  Returns a cursor-paginated lightweight list for card UIs with AB-test counts already merged
  into each goal entry.
  """
  goalCardList(site: Int, search: String, cursor: String, limit: Int): GoalCardListMeta!

  """
  Returns the selector-oriented goal shape by id, including soft-deleted goals so existing links
  can still resolve after deletion.
  """
  goalLinked(id: Int!): GoalLinked!

  """
  Returns a lightweight goal reference by id, including soft-deleted goals so stored
  associations remain introspectable.
  """
  goalRef(id: Int!): GoalRef!

  """
  Returns lightweight goal references for the requested ids and preserves the caller's id order
  in the response.
  """
  goalsByIds(ids: [Int!]!): [GoalRef!]!

  """
  Returns the full goal record for one id with AB-test counts merged in; unlike the lightweight
  reference queries, this excludes soft-deleted goals for direct lookups.
  """
  goalDetail(id: Int!, startDate: Int, endDate: Int, presetDate: String): Goal!

  """
  Returns aggregate counts for one goal and each active trigger; omitted dates are clamped to
  the goal's lifetime, and monetary totals are converted into the viewer's default currency.
  """
  goalCounts(id: Int!, startDate: Int, endDate: Int): GoalCounts!

  """
  Returns day, week, or month buckets for one goal; each bucket includes total and unique
  conversions plus trigger-level breakdowns, with bucket ends clamped to the requested end date.
  """
  goalDistribution(id: Int!, startDate: Int, endDate: Int, timeUnit: TimeUnit!): [GoalDistribution!]!

  """
  Returns page-level conversion metrics for one goal with server-side search, sort, and
  pagination; unique visitors are attributed to their first conversion page and total values are
  converted to the viewer's default currency.
  """
  goalPageConversions(
    id: Int
    siteId: Int
    startDate: Int
    endDate: Int
    search: String
    page: Int
    perPage: Int
    order: GoalPageConversionsOrder
  ): GoalPageList

  "Returns conversion metrics grouped by one selected goal-conversion dimension."
  goalConversionBreakdown(
    id: Int
    siteId: Int
    startDate: Int
    endDate: Int
    dimension: GoalConversionDimension!
    page: Int
    perPage: Int
    order: GoalConversionBreakdownOrder
  ): GoalConversionBreakdownList

  """
  Returns images visible to the current session, optionally site-scoped. Pagination uses an
  opaque cursor that accumulates already-seen image ids, and `source` defaults to `surveys`.
  """
  imageList(siteId: Int, cursor: String, filter: ImageFilter, source: String): ImageListMeta!

  """
  Returns one image by id when it is visible to the current session under the same user/site
  access rules as the list query.
  """
  imageDetail(id: ID!, siteId: Int): Image!

  """
  Returns notification rules the current session can view with `notifications:nav`, limited to
  supported resources (`goal`, `survey`, and site error notifications) and filterable by site,
  channel type, search text, or resource.
  """
  notificationsList(
    cursor: String
    limit: Int
    siteId: Int
    resource: NotificationResource
    resourceId: String
    order: NotificationsListOrder
    search: String
    type: ChannelType
  ): NotificationsListMeta

  """
  Returns presigned S3 POST payloads for the page-camera upload flow. With `snapshot_id` it
  validates edit access to an existing manual snapshot and returns `format_version`,
  `screenshot`, and `elements`; with `source_url` plus `device` it validates a new capture
  request and returns `screenshot` plus `fingerprints`.
  """
  pageCameraGetUploadPolicy(snapshotId: Int, sourceUrl: String, device: String): GetUploadPolicyMeta!

  """
  Returns page-camera session state derived from the current user session, including whether the
  viewer can edit snapshots and whether creating one more snapshot would exceed quota.
  """
  pageCameraIsLoggedIn: LoggedInResult!

  """
  Returns manual snapshots the current session can edit; this list excludes read-only access and
  is transformed into the shared snapshot GraphQL shape.
  """
  pageCameraSnapshots: [Snapshot!]!

  """
  Internal debug hook that writes the provided message to server logs along with the request
  user agent and current user id.
  """
  pageCameraDebug(message: String!): String

  """
  Returns whether the requested owner/user account relationship exists for the domain and
  whether that session could create or edit the site if needed.
  """
  pageEditorListPermissions(domain: String!, ownerId: Int, userId: Int): PageEditorListPermissionsMeta!

  """
  Checks page-editor script installation for one page/device pair, first trusting an installed
  site record and otherwise falling back to a live script check.
  """
  pageEditorCheckScript(pageId: String!, device: SnapshotDevice!): PageEditorScriptCheckResponse

  """
  Returns the most relevant editor for the current user, preferring editors with published
  changes before falling back to the most recently opened editor.
  """
  pageEditorLatest: String

  """
  Loads a page editor by editor UUID, updates its last-opened timestamp, and may bind an
  unowned editor to the current user session.
  """
  pageEditorGetEditor(editorId: String!): PageEditorResponse

  """
  Resolves the capability set for the user currently associated with this editor rather than for
  the caller, returning null when the editor is still unassigned.
  """
  pageEditorCapabilities(editorId: String!): Capabilities

  """
  Returns brand-guideline settings for the editor/site pair with Crazy Egg defaults merged in
  when settings are missing or partially stored.
  """
  pageEditorGetBrandGuidelines(editorId: String!, site: String!): String

  pageSpeedPage(id: Int!): PageSpeedPage

  """
  Returns the list of active pages registered for scheduled
  Page Speed runs.
  """
  pageSpeedPages(siteId: Int!): [PageSpeedPage!]!

  pageSpeedRuns(pageSpeedPageId: Int!): [PageSpeedRun!]!

  pageSpeedRunAnalysis(pageSpeedRunId: Int!): PageSpeedRunAnalysis!

  pageSpeedRunAudits(pageSpeedRunId: Int!): PageSpeedRunAudits!

  """
  Returns recommended playlists together with the site's saved playlists; saved filters may be
  migrated to the requested version before the combined result is alphabetized.
  """
  playlistsList(site: Int!, version: Int): [Playlist!]!

  """
  Returns the current viewer's most recently used playlists for the site and backfills with
  recommended playlists when the usage history does not satisfy the requested limit.
  """
  playlistsMostRecent(site: Int!, limit: Int): [PlaylistUsage!]!

  """
  Returns the shared country dropdown values used by product forms; this is a static helper
  list with country names and codes, not account-specific data.
  """
  countries: [CountryOption!]!

  "Returns the supported currency-code allow-list used by universal segment money conditions."
  supportedCurrencyCodes: [CurrencyOption!]!

  "Returns the supported language-code list used by the shell and audience filters."
  languages: [LanguageOption!]!

  """
  Returns a cursor-paged recordings feed for one site, applying the serialized filters payload
  and per-recording permission state.
  """
  recordingsList(
    site: Int!
    filters: String!
    cursor: String
    limit: Int
    order: RecordingsListOrder!
  ): RecordingsListMeta

  """
  Returns page-based recording groups keyed by normalized first or last page, with
  `include_first` only prepending a matching group on the first page before normal cursor
  pagination.
  """
  recordingsGroups(
    site: Int!
    groupBy: RecordingGroupBy!
    filters: String!
    cursor: String
    limit: Int
    includeFirst: String
  ): RecordingsGroupsMeta

  """
  Returns cursor-paged recording counts grouped by recording date, not by arbitrary date ranges
  from the filters payload.
  """
  recordingsDateGroups(site: Int!, filters: String!, cursor: String, limit: Int): RecordingsDateGroupsMeta

  """
  Returns one numbered page of recordings inside a normalized page group; unlike
  `recordings_list`, pagination is page-based rather than cursor-based.
  """
  recordingsInGroup(
    site: Int!
    groupBy: RecordingGroupBy!
    group: String!
    filters: String!
    page: Int
    limit: Int
    order: RecordingsListOrder!
  ): RecordingsInGroupMeta

  """
  Returns only ids plus viewer-specific watch state and permissions for every recording in a
  page group, which is useful for bulk actions without hydrating full recording objects.
  """
  recordingsIdsInGroup(site: Int!, groupBy: RecordingGroupBy!, group: String!, filters: String!): [RecordingIdInGroup!]

  """
  Returns ids for a single recorded-on date together with raw `session_id` values, which is the
  key expected by APIs that fetch recordings by session id.
  """
  recordingsIdsInDateGroup(site: Int!, group: String!, filters: String!): [RecordingIdInDateGroup!]

  recordingsCount(site: Int!, filters: String!): Int

  """
  Returns distinct recording tags for one site using a capped autocomplete-style lookup rather
  than scanning full recording payloads.
  """
  recordingsTags(site: Int!, fragment: String, limit: Int): [String!]

  """
  Returns the JSON filter-definition schema for the requested version, falling back to the
  transmissible version when needed and hiding visited-page criteria for flagged sessions.
  """
  recordingsCriteriaDefinition(version: Int): String

  """
  Returns per-term recording counts across either one site or every accessible site, separating
  unmatched terms into `not_found` and reporting whether each match came from `identifier` or
  `visitor_id`.
  """
  visitorsRecordings(
    terms: [String!]!

