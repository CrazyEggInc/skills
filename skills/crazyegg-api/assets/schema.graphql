  "Up to three goals ranked by descending current-window conversion count."
  topConversions: [GoalStub]!
}

"One of the top three goals by current-window conversion count in `dashboard`."
type GoalStub {
  id: Int!

  name: String!

  "Conversion event count for the current window."
