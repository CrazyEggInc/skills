  url: String!

  title: String

  pageType: SiteMapPageType

  visibility: SiteMapPageVisibility!

  "Relative importance within the Site, higher first. Null until crawled."
  importanceScore: Float

  "Presigned screenshot URL, valid for 15 minutes; null without a screenshot."
  screenshotUrl: String

  "Last successful crawl fetch in Unix seconds; null until fetched, when `title` may be a link label."
  crawledAt: Int

  "When the Site's Recordings, Web Analytics or Google Analytics imports last saw the page (unix seconds)."
  observedAt: Int
}

"Whether asking `siteMapPages` again can return more pages; independent of `coverage`."
enum SiteMapPagesStatus {
  "Nothing is queued or running; asking again returns nothing new."
  READY

  """
  A Spider run (quick crawl, crawl, enrichment, classification or observe
  run) is queued or running, or this request asked for one; ask again in 10
  to 30 seconds for more pages.
  """
  PENDING

  """
  No pages and nothing pending: the quick crawl failed or was refused; see
  `reason`. Ask again after `retryAfterS` seconds, or stop when it is null.
  """
  UNAVAILABLE
}

"""
Why `siteMapPages` is `UNAVAILABLE`. Retry later, after `retryAfterS`:
`COOLDOWN`, `ACCOUNT_CAP`, `FETCH_DEFERRED`, `FETCH_FAILED`, `NOTHING_FOUND`,
`TIMEOUT` and `SPIDER_UNREACHABLE`. Configuration or Spider problems that
asking again will not fix: `NOT_CONFIGURED`, `INVALID_TOKEN`, `SPIDER_ERROR`,
`ENQUEUE_FAILED` and `INVALID_PARAMS`. The Site cannot be mapped:
`INVALID_HOST`, `UNAUTHORIZED` and `SITE_DELETED`.
"""
enum SiteMapUnavailableReason {
  "Spider crawled the host recently and refused another quick crawl."
  COOLDOWN

  "The account reached Spider's crawl limit (reserved; Spider does not send it yet)."
  ACCOUNT_CAP

  "Another crawl of the host holds Spider's fetch slot."
  FETCH_DEFERRED

  "The Site's name is not a public host Spider may crawl."
  INVALID_HOST

  "The quick crawl reached the host but found no pages."
  NOTHING_FOUND

  "Spider could not fetch the Site's pages."
  FETCH_FAILED

  "Spider found that the user may not access the Site."
  UNAUTHORIZED

  "Spider found the Site deleted."
  SITE_DELETED

  "Spider could not queue the run."
  ENQUEUE_FAILED

  "Spider rejected the request's parameters."
  INVALID_PARAMS

  "This environment has no Spider."
  NOT_CONFIGURED

  "Spider did not answer in time."
  TIMEOUT

  "Spider could not be reached."
  SPIDER_UNREACHABLE

  "Spider answered in an unexpected way."
  SPIDER_ERROR

  "Spider rejected this environment's credentials; asking again will not help."
