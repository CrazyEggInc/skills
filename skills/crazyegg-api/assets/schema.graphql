schema {
  subscription: RootSubscriptionType
  mutation: RootMutationType
  query: RootQueryType
}

type RootQueryType {
  """
  Returns a cursor-paginated page of non-deleted tests with all-time results for each test's primary goal. Without
  `order`, tests come newest id first; pass `nextPageCursor` back as `cursor` for the next page. Use `abTestRefList`
  for lightweight selectors and `abTestResultCounts` for goal- or date-scoped results. Requires A/B testing view
  access.
  """
  abTestList(
    "Site id from `sites`; omit to include all accessible sites."
    site: Int

    "Opaque `nextPageCursor` from this list query; omit for the first page."
    cursor: String

    "Number of tests to return, at least 1; defaults to 10, with no maximum enforced."
    limit: Int

    "Substring matched against test name, page URL, or test id; omit for no search filter."
    search: String

    "Filter by `DRAFT`, `RUNNING`, or `STOPPED`; omitted, null, or `DELETED` leaves statuses unfiltered."
    status: AbTestStatus

    "Sort settings; omitted sorts by id descending, while an empty object uses creation time descending."
    order: AbTestListOrder
  ): AbTestsListMeta!

  """
  Returns all non-deleted tests and their variant ids for a site, ordered by test name then id.
  Use this unpaginated list for selectors instead of loading metrics with `abTestList`.
  Requires A/B testing view access.
  """
  abTestRefList("Site id from `sites`; required to scope the selector list." site: Int!): [AbTestRef!]!

  "Identical to `abTestList`, with the same arguments, ordering, cursor, and results. Requires A/B testing view access."
  abTestDashboardList(
    "Site id from `sites`; omit to include all accessible sites."
    site: Int

    "Opaque `nextPageCursor` from this list query; omit for the first page."
    cursor: String

    "Number of tests to return, at least 1; defaults to 10, with no maximum enforced."
    limit: Int

    "Substring matched against test name, page URL, or test id; omit for no search filter."
    search: String

    "Filter by `DRAFT`, `RUNNING`, or `STOPPED`; omitted, null, or `DELETED` leaves statuses unfiltered."
    status: AbTestStatus

    "Sort settings; omitted sorts by id descending, while an empty object uses creation time descending."
    order: AbTestListOrder
  ): AbTestsListMeta!

  """
  Returns the most recently created RUNNING or STOPPED tests, newest first, with all-time results for each test's
  primary goal; there is no cursor. Use `abTestList` for filters and pagination. Requires A/B testing view access.
  """
  abTestHomeRecent(
    "Site id from `sites`; omit to include all accessible sites."
    site: Int

    "Number of tests to return, at least 1; defaults to 3, with no maximum enforced."
    limit: Int
  ): [AbTest!]!

  """
  Returns a numbered page of non-deleted tests, newest created first, optionally filtered by primary goal; `startDate`
  and `endDate` limit the attached results, not which tests are listed. Use `abTestList` for cursor pagination and
  search. Requires A/B testing view access; a shared goal link can also list that goal's tests.
  """
  abTestListPaginated(
    "Site id from `sites`; omit to include all accessible sites."
    site: Int

    "Page size, at least 1; required in practice because omitted or null values fail validation."
    limit: Int

    "Primary goal id from `goalRefList`; omit to include tests for all goals."
    goalId: Int

    "Inclusive metrics start in Unix seconds (UTC); omit for no lower date filter."
    startDate: Int

    "Inclusive metrics end in Unix seconds (UTC); omit for no upper date filter."
    endDate: Int

    "Page number starting at 1; required, with no upper limit enforced."
    page: Int!
  ): AbTestsListPaginatedMeta!

  """
  Returns one non-deleted test's editor data without loading metrics; a missing id is an error.
  Use `abTestResultDetail` for the default selected goal and `abTestResultCounts` for metrics.
  Requires A/B testing view access; shared access is also supported.
  """
  abTestEditorDetail("Test id from `abTestList` or `abTestRefList`; deleted tests are excluded." id: Int!): AbTest!

  """
  Returns one non-deleted test's structure and primary goal as `selectedGoal`, without metrics.
  Use `abTestResultCounts` for goal/date-scoped metrics; a missing test or primary goal is an error.
  Requires A/B testing view access; shared access is also supported.
  """
  abTestResultDetail("Test id from `abTestList` or `abTestRefList`; deleted tests are excluded." id: Int!): AbTest!

  """
  Returns totals and ordered per-variant metrics for one non-deleted test and a goal on its site.
  Use `abTestResultDetail` for structure or `abTestDistribution` for time buckets; variants default
  to name ascending. Missing tests or goals are errors.
  Requires A/B testing view access; shared access is also supported.
  """
  abTestResultCounts(
    "Test id from `abTestList` or `abTestRefList`; deleted tests are excluded."
    id: Int!

    "Goal id from `goalRefList` for the test site; a missing or different-site goal is an error."
    goalId: Int!

    "Inclusive metrics start in Unix seconds (UTC); omit for no lower date filter."
    startDate: Int

    "Inclusive metrics end in Unix seconds (UTC); omit for no upper date filter."
    endDate: Int

    "Per-variant sort settings; defaults to variant name ascending."
    order: AbTestVariantOrder
  ): AbTestResultCounts!

  """
  Returns chronological day, week, or month metric buckets for a non-deleted test and same-site goal.
  Use `abTestResultCounts` for totals; dates are clamped to publication and stop dates, and an
  inverted range returns an empty list. Weeks start on Monday and months on the first, after any
  partial first bucket. Requires A/B testing view access; shared access is also supported.
  """
  abTestDistribution(
    "Test id from `abTestList` or `abTestRefList`; deleted tests are excluded."
    id: Int!

    "Goal id from `goalRefList` for the test site; a missing or different-site goal is an error."
    goalId: Int!

    "Inclusive start in Unix seconds (UTC); defaults to publication when available and is clamped to it."
    startDate: Int

    """
    Inclusive end in Unix seconds (UTC); defaults to the stop time, or to the start for a test that is not stopped,
    so pass it for RUNNING tests.
    """
    endDate: Int

    "Bucket size: `DAY`, `WEEK`, or `MONTH`; the first and last buckets may cover partial periods."
    timeUnit: TimeUnit!
  ): [AbTestDistribution!]!

  """
  Returns counts of non-deleted tests by status across the sites the caller can access. Use this instead of paging
  through `abTestList` to count tests. Passing `site` checks access to it but does not reliably limit the counts to
  that site. Requires A/B testing view access.
  """
  abTestStatusCounts(
    "Site id from `sites`; an inaccessible id returns an error, but the counts are not reliably limited to it."
    site: Int
  ): AbTestStatusCountsResult!

  """
  Returns one accessible site export and its current generation and notification status. Use `aiExports` for
  recent requests or read this operation again after creation; the download URL is null until completion and after
  expiry. Requires a logged-in session, site access, and view access to every included feature; missing or
  inaccessible exports return an error.
  """
  aiExport(
    "Site ID from `sites` containing the export."
    siteId: Int!

    "Export ID from `createAiExport` or `aiExports`; not a site ID."
    id: Int!
  ): AiExport

  """
  Returns accessible exports from the site's latest 100 requests, ordered by creation time then ID descending.
  Requests containing features the caller cannot view are omitted after the limit; there is no cursor. Use
  `aiExport` to inspect one request and its download availability. Requires a logged-in session, export
  availability, site access, and view access to included features.
  """
  aiExports("Site ID from `sites` whose recent export requests to list." siteId: Int!): [AiExport!]!

  """
  Returns the signed-in viewer profile, active account settings, subscriptions, and accessible accounts.
  Profile fields describe the viewer, while `userId` identifies the active account and `guestId` identifies
  the viewer. Use `capabilities` for product permissions rather than `features`. Requires authentication.
  """
  me: MeDetails

  """
  Returns the active account API key, secret, and signature, creating credentials on first access if both
  are absent. Use `regenerateUserApiCredentials` to replace existing credentials. Requires API edit access.
  """
  api: ApiKeys

  """
  Returns a container for tracking settings; select nested fields to retrieve values. Use `me.settings` for
  saved account preferences. The IP and cookie-blocking fields require tracking options edit access.
  """
  options: Options

  """
  Returns authentication, impersonation, and shared-resource state for the current request. Use `me` for
  profile and active account data.
  """
  sessionInfo: SessionInfo

  """
  Returns the onboarding checklist tasks with dependency slugs, completion state, and the permission for
  each task. Reading also records completion for tasks whose conditions are now met. Use
  `trackGettingStarted` to record views or clicks. Requires authentication.
  """
  gettingStarted: [GettingStarted]

  """
  Returns the active account billing profile, including masked card details and company addresses. Use
  `defaultPaymentMethod` for the current card from Stripe and `paymentTransactionList` for billing history.
  Requires billing navigation access.
  """
  billingDetails: BillingDetails

  """
  Returns email notification preferences with defaults for every supported notification. Reading initializes
  missing signup notification preferences as opted out. Use `setUserNotifications` to change preferences.
  Requires Crazy Egg email settings navigation access.
  """
  userNotifications: UserNotifications

  """
  Returns a fresh JWT for the active account with its expiration time. The token expires two hours after
  issuance. Requires authentication.
  """
  interagentJwt: InteragentJwt

  """
  Same result, arguments, and access as `adPerformanceHeader`: the site's enabled ad-account connections with their
  import and sync status. Requires Ad Performance view access.
  """
  adsLibraryPreviewHeader("Accessible site id from `sites`." siteId: Int!): AdPerformanceHeader

  """
  Same result, arguments, and access as `adPerformanceAdPreview`: one imported ad's identity and normalized creative
  preview. Requires Ad Performance view access.
  """
  adsLibraryPreviewAdPreview(
    "Accessible site id from `sites`."
    siteId: Int!

    "Crazy Egg ad id from `adPerformanceAdTree` or platform-mode performance results; not the provider's ad id."
    adId: Int!
  ): AdPerformanceAdPreviewPayload

  """
  Same result, arguments, and access as `adPerformance`: spend, tracked visits, attributed conversions, rankings,
  daily charts, and recommendations for a site's ads. Requires Ad Performance view access.
  """
  adsLibraryPreviewPerformance(
    "Accessible site id from `sites`."
    siteId: Int!

    "Unix seconds; uses the UTC date as an inclusive start. Omit for no lower bound; `presetDate` takes precedence."
    startAt: Int

    "Unix seconds; uses the UTC date as an inclusive end. Omit for no upper bound; `presetDate` takes precedence."
    endAt: Int

    """
    Case-insensitive UTC preset that overrides `startAt`/`endAt`: today, yesterday, recent, last 7 days, last 30
    days, this month, last month. `recent` includes today; last 7/30 days exclude it. Other values return an error.
    """
    presetDate: String

    "Providers to include in `PLATFORM` mode; omitted or [] selects all enabled connections. Ignored in `UTM` mode."
    platforms: [AdPlatformSource!]

    """
    Crazy Egg campaign ids from `adPerformanceAdTree`; unioned with ad-group/ad filters. First 500 unique ids used;
    ignored in `UTM` mode.
    """
    campaignIds: [Int!]

    """
    Crazy Egg ad-group ids from `adPerformanceAdTree`; unioned with campaign/ad filters. First 500 unique ids used;
    ignored in `UTM` mode.
    """
    adGroupIds: [Int!]

    """
    Crazy Egg ad ids from `adPerformanceAdTree`; unioned with campaign/ad-group filters. First 500 unique ids used;
    ignored in `UTM` mode.
    """
    adIds: [Int!]

    """
    Goal id from `goalCardList` or `controls.availableGoals`; 0 counts all goals. When omitted, a goal with
    conversions in the range is chosen and reported in `controls.selectedGoalId`, or all goals when none has any.
    """
    goalId: Int

    """
    `PLATFORM` matches imported ads and includes spend; `UTM` groups tracking parameters without spend. Defaults to
    `PLATFORM`.
    """
    dataMode: AdPerformanceDataMode

    "Earliest or latest eligible ad visit before conversion; defaults to `LAST_TOUCH`."
    attributionModel: AdPerformanceAttributionModel

    """
    Lookback from conversion to eligible ad visit, in days: 1, 7, 30, or 90. Defaults to 1; other values fall back
    to 1.
    """
    conversionWindowDays: Int
  ): AdPerformance

  """
  Returns a site's enabled ad-account connections (Meta, Google, Reddit) with import and sync status, ordered by
  provider then connection id. Use `adPerformance` for metrics and `adPerformanceAdTree` for filter ids. Requires Ad
  Performance view access.
  """
  adPerformanceHeader("Accessible site id from `sites`." siteId: Int!): AdPerformanceHeader

  """
  Returns an imported ad's identity and normalized creative for rendering a preview, or an error when the ad is not
  on the site. May fetch fresh Meta media from Meta and save it; unsupported formats return `previewSupported:
  false` with whatever text and media are available. Requires Ad Performance view access.
  """
  adPerformanceAdPreview(
    "Accessible site id from `sites`."
    siteId: Int!

    "Crazy Egg ad id from `adPerformanceAdTree` or platform-mode performance results; not the provider's ad id."
    adId: Int!
  ): AdPerformanceAdPreviewPayload

  """
  Returns a site's ad spend, tracked ad visits, attributed conversions and revenue, top-ad rankings, daily charts, and
  recommendations for a date range. Parts that time out or fail return zeros or empty lists, so check `slices` before
  trusting them. Use `adPerformanceHeader` for sync status only. Requires Ad Performance view access.
  """
  adPerformance(
    "Accessible site id from `sites`."
    siteId: Int!

    "Unix seconds; uses the UTC date as an inclusive start. Omit for no lower bound; `presetDate` takes precedence."
    startAt: Int

    "Unix seconds; uses the UTC date as an inclusive end. Omit for no upper bound; `presetDate` takes precedence."
    endAt: Int

    """
    Case-insensitive UTC preset that overrides `startAt`/`endAt`: today, yesterday, recent, last 7 days, last 30
    days, this month, last month. `recent` includes today; last 7/30 days exclude it. Other values return an error.
    """
    presetDate: String

    "Providers to include in `PLATFORM` mode; omitted or [] selects all enabled connections. Ignored in `UTM` mode."
    platforms: [AdPlatformSource!]

    """
    Crazy Egg campaign ids from `adPerformanceAdTree`; unioned with ad-group/ad filters. First 500 unique ids used;
    ignored in `UTM` mode.
    """
    campaignIds: [Int!]

    """
    Crazy Egg ad-group ids from `adPerformanceAdTree`; unioned with campaign/ad filters. First 500 unique ids used;
    ignored in `UTM` mode.
    """
    adGroupIds: [Int!]

    """
    Crazy Egg ad ids from `adPerformanceAdTree`; unioned with campaign/ad-group filters. First 500 unique ids used;
    ignored in `UTM` mode.
    """
    adIds: [Int!]

    """
    Goal id from `goalCardList` or `controls.availableGoals`; 0 counts all goals. When omitted, a goal with
    conversions in the range is chosen and reported in `controls.selectedGoalId`, or all goals when none has any.
    """
    goalId: Int

    """
    `PLATFORM` matches imported ads and includes spend; `UTM` groups tracking parameters without spend. Defaults to
    `PLATFORM`.
    """
    dataMode: AdPerformanceDataMode

    "Earliest or latest eligible ad visit before conversion; defaults to `LAST_TOUCH`."
    attributionModel: AdPerformanceAttributionModel

    """
    Lookback from conversion to eligible ad visit, in days: 1, 7, 30, or 90. Defaults to 1; other values fall back
    to 1.
    """
    conversionWindowDays: Int
  ): AdPerformance

  """
  Returns the site's imported ads from enabled connections as a provider account, campaign, ad group, and ad tree
  whose ids feed the `campaignIds`, `adGroupIds`, and `adIds` filters of `adPerformance`. Holds at most 2000 ads
  without pagination and sets `truncated` when more exist; children sort by name then id. Requires Ad Performance
  view access.
  """
  adPerformanceAdTree("Accessible site id from `sites`." siteId: Int!): AdPerformanceAdTreePayload

  """
  Returns cursor-paged surveys and CTAs, newest created first, excluding deleted records. Use addonDetail for
  one UUID; omitting the type includes only types the caller may view. Requires survey view access or CTA view
  access.
  """
  addonList(
    "Site ID from sites; omit to include accessible sites."
    siteId: Int

    "Opaque nextPageCursor from addonList; omit for the first page."
    cursor: String

    "Page size, search text, add-on type, and publication status."
    filter: AddonFilter!
  ): AddonListMeta!

  """
  Returns an existing add-on by UUID; missing or unauthorized records return an error. Use addonList to
  discover IDs; linked audit records may resolve deleted add-ons. Requires survey view access or CTA view
  access matching the type; matching shared links are allowed.
  """
  addonDetail("Add-on UUID from addonList or addonDetail." id: String!): Addon

  """
  Returns the theme JSON object from the most recently created add-on of a type at a site, preferring nonblank
  draft content. Returns null if no add-on or usable theme exists. Requires survey create access or CTA create
  access matching the type.
  """
  addonLatestTheme(
    "Site ID from sites."
    siteId: Int!

    "Add-on type whose most recently created theme to reuse."
    type: AddonType!
  ): JSON

  """
  Returns the JSON Schema (`schema`) and a representative content object (`example`) for add-on `content`
  and `draftContent` of the requested type; `contractRevision` identifies that contract. JSON-encode the
  object before sending it as `content`. The `addon-draft-create` skill is the long-form authoring reference.
  Requires survey create access or CTA create access matching the type.
  """
  addonContentContract("SURVEY or CTA; selects the schema and example." type: AddonType!): AddonContentContract!

  """
  Returns the shared survey and CTA template catalog, newest created first, plus whether the session may
  manage templates. Use addonTemplateDetail for one template. Requires survey view access or CTA view access.
  """
  addonTemplatesList: AddonTemplateListMeta!

  """
  Returns one reusable template, or null when its integer ID does not exist. Use addonTemplatesList to
  discover template IDs. Requires survey view access or CTA view access.
  """
  addonTemplateDetail("Template ID from addonTemplatesList." id: Int!): AddonTemplate

  """
  Returns one suggestion and marks it clicked if it is not already used or clicked. Use addonSuggestionsList
  to discover suggestions for a site. Requires survey view access.
  """
  addonSuggestionDetail("Suggestion ID from addonSuggestionsList." id: Int!): AddonSuggestion

  """
  Returns recent suggestions for a site, defaulting to three, and marks eligible suggestions viewed. Use
  addonSuggestionDetail to open a particular suggestion. Requires survey view access.
  """
  addonSuggestionsList(
    "Survey suggestion category; currently only SURVEY."
    type: AddonSuggestionType!

    "Site ID from sites."
    siteId: Int!

    "Maximum suggestions to return; defaults to 3."
    limit: Int
  ): [AddonSuggestion]!

  """
  Returns total, draft, active, and inactive counts for accessible add-ons, optionally scoped to a site and
  type. Use addonList for the records; absent counts resolve to zero. Requires survey view access or CTA view
  access.
  """
  addonStatusCounts(
    "Site ID from sites; omit to include accessible sites."
    site: Int

    "Optional type filter; omitted types are narrowed to those the caller may view."
    type: AddonType
  ): AddonStatusCountsResult!

  """
  Returns AI referral session and page-view counts for exactly one site or imported Google Analytics property,
  recognizing ChatGPT, Claude, Gemini, Perplexity, Microsoft Copilot, and Grok by host or subdomain. Defaults to
  the previous 30 complete UTC dates and accepts 1 to 60 inclusive dates within available history. Sources without
  sessions are omitted; the rest sort by sessions descending, then name. Use `analytics` for all referrers.
  Requires web analytics view access and access to the source.
  """
  analyticsAiReferrals(
    "Site ID from `sites`; supply exactly one of `siteId` and `googleAnalyticsPropertyId`."
    siteId: Int

    "Imported property ID from `gaProperties`; mutually exclusive with `siteId`."
    googleAnalyticsPropertyId: Int

    "Inclusive YYYY-MM-DD date; default 30 days before today in UTC. Window must span 1 to 60 dates."
    startDate: String

    """
    Inclusive YYYY-MM-DD date; default yesterday in UTC. Site data uses UTC dates; GA uses imported report
    dates.
    """
    endDate: String
  ): AnalyticsAiReferrals

  """
  Returns aggregate metrics and ranked dimensions for a site or imported Google Analytics property. Use
  `analyticsDimension` for one dimension or `analyticsOverTime` for its series. Supply a preset or window within
  available history; ranking defaults to descending page views for pages and visitors otherwise, with
  per-dimension cursors. Missing metrics resolve to null. Requires web analytics view access.
  """
  analytics(
    "Site ID from `sites` for SITE, or property ID from `gaProperties` for GA_PROPERTY."
    sourceId: Int!

    "SITE selects Crazy Egg data; GA_PROPERTY selects imported Google Analytics data."
    sourceType: AnalyticsSource!

    """
    Optional case-insensitive substring filter on every dimension's raw values (page domain plus path, referrer
    domain, country or language code); aggregate totals ignore it.
    """
    searchTerm: String

    """
    Unix seconds for the window start. Supply with `endAt` when no preset is given; site dates use UTC and GA
    dates use the property's time zone.
    """
    startAt: Int

    """
    Unix seconds. SITE aggregates exclude this instant; dimension rows include its UTC date. GA includes this
    local date. Supply with `startAt` unless `presetDate` is used.
    """
    endAt: Int

    """
    Case-insensitive preset that overrides `startAt`/`endAt`: `today`, `yesterday`, `recent` (today plus six prior
    days), `last 7 days`, `last 30 days` (both end yesterday), `this month`, or `last month`; others error.
    """
    presetDate: String

    """
    Defaults to PAGE_VIEWS for pages and VISITORS otherwise. Pages accept NAME, PAGE_VIEWS, or AVG_TIME_ON_PAGE;
    other columns fall back to PAGE_VIEWS.
    """
    orderBy: OrderColumn

    "Ranking direction, default DESC. Metric ties use ascending names, with domain and path ordering for pages."
    orderDir: OrderDir

    "Per-dimension boundaries from `analytics.nextCursor`; omit for the first request."
    cursor: AnalyticsCursorArg

    """
    Top time-series count, default 5, with remaining values grouped as `others`. Used by `analyticsOverTime`;
    ranked-row queries do not use it.
    """
    numSegments: Int

    "Bucket size, default DAY. Site dates use UTC; GA dates use the property's time zone."
    granularity: TimeUnit
  ): Analytics

  """
  Returns one ranked dimension under `dimension`; use `analytics` for multiple dimensions. Supply a preset or
  window within available history. Defaults to descending page views for pages and visitors otherwise; reuse
  `nextCursor` to continue, and a null cursor means no rows were returned. Requires web analytics view access.
  """
  analyticsDimension(
    "Breakdown to return; page and entry-page series always measure page views."
    dimension: AnalyticsDimension!

    "Site ID from `sites` for SITE, or property ID from `gaProperties` for GA_PROPERTY."
    sourceId: Int!

    "SITE selects Crazy Egg data; GA_PROPERTY selects imported Google Analytics data."
    sourceType: AnalyticsSource!

    """
    Optional case-insensitive substring filter. Countries and languages match display names and referrers match
    name or domain after the row limit; other dimensions match raw values before it.
    """
    searchTerm: String

    """
    Unix seconds for the window start. Supply with `endAt` when no preset is given; site dates use UTC and GA
    dates use the property's time zone.
    """
    startAt: Int

    """
    Unix seconds; rows include this calendar date, in UTC for SITE or the property's time zone for GA. Supply
    with `startAt` unless `presetDate` is used.
    """
    endAt: Int

    """
    Case-insensitive preset that overrides `startAt`/`endAt`: `today`, `yesterday`, `recent` (today plus six prior
    days), `last 7 days`, `last 30 days` (both end yesterday), `this month`, or `last month`; others error.
    """
    presetDate: String

    "Maximum fetched rows, default 250. Use a nonnegative count, or -1 for no row limit."
    limit: Int

    """
    Defaults to PAGE_VIEWS for pages and VISITORS otherwise. Pages accept NAME, PAGE_VIEWS, or AVG_TIME_ON_PAGE;
    other columns fall back to PAGE_VIEWS.
    """
    orderBy: OrderColumn

    "Ranking direction, default DESC. Metric ties use ascending names, with domain and path ordering for pages."
    orderDir: OrderDir

    """
    Boundary from `analyticsDimension.nextCursor`; omit initially. Only pages, entry pages, referrers, and UTM
    dimensions paginate; other dimensions ignore cursors.
    """
    cursor: AnalyticsCursorDataArg

    """
    Top time-series count, default 5, with remaining values grouped as `others`. Used by `analyticsOverTime`;
    ranked-row queries do not use it.
    """
    numSegments: Int
  ): AnalyticsSingle

  """
  Returns the top dimension count series and an `others` group for a preset or window within available history.
  Use `analyticsDimension` for ranked rows; sibling aggregate fields are null. Page and entry-page series always
  measure page views; optional goal conversions apply only to site sources. Requires web analytics view access.
  """
  analyticsOverTime(
    "Breakdown to return; page and entry-page series always measure page views."
    dimension: AnalyticsDimension!

    "Count for non-page series; page and entry-page series always use PAGE_VIEWS."
    metric: AnalyticsMetric!

    "Site ID from `sites` for SITE, or property ID from `gaProperties` for GA_PROPERTY."
    sourceId: Int!

    "SITE selects Crazy Egg data; GA_PROPERTY selects imported Google Analytics data."
    sourceType: AnalyticsSource!

    """
    Unix seconds for the window start. Supply with `endAt` when no preset is given; site dates use UTC and GA
    dates use the property's time zone.
    """
    startAt: Int

    """
    Unix seconds; dimension series include this calendar date in the source time zone. Optional conversions
    count events before this instant plus one day.
    """
    endAt: Int

    """
    Case-insensitive preset that overrides `startAt`/`endAt`: `today`, `yesterday`, `recent` (today plus six prior
    days), `last 7 days`, `last 30 days` (both end yesterday), `this month`, or `last month`; others error.
    """
    presetDate: String

    """
    Top time-series count, default 5, with remaining values grouped as `others`. Used by `analyticsOverTime`;
    ranked-row queries do not use it.
    """
    numSegments: Int

    "Bucket size, default DAY. Site dates use UTC; GA dates use the property's time zone."
    granularity: TimeUnit

    "Optional goal ID from `goalRefList` for this site's conversions; used only for SITE sources."
    goalId: Int
  ): Analytics

  """
  Returns goal conversion event counts in chronological buckets for a site and preset or window within available
  history. Use `analyticsOverTime` to combine a dimension series with conversions. Presets use UTC and conversion
  counts read site goals even though `sourceType` is required. Requires web analytics view access.
