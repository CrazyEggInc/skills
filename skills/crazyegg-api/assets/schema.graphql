  reason: SiteMapUnavailableReason

  "When `UNAVAILABLE`, seconds after which asking again may help; null means stop asking."
  retryAfterS: Int

  coverage: SiteMapCoverage!

  """
  When the newest completed crawl finished, or before any crawl the newest
  quick crawl (unix seconds).
  """
  projectionAt: Int

