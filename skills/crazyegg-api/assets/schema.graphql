"Resource kind used to create a share link and interpret its resource identifier."
enum SharedUrlType {
  "Heatmap id from `snapshotsList`, for sharing a report with collected visits."
  SNAPSHOT

  "Numeric id from `recordingsIdsInGroup`, for sharing playback."
  RECORDING

  "A/B test id from `abTestList`, for sharing test results."
  ABTEST

  "Fingerprint from `uniqueErrorList`, for sharing a site error."
  ERROR

  "Survey add-on id from `addonList`, for sharing survey results."
  SURVEY

  "CTA add-on id from `addonList`, for sharing CTA results."
  CTA

  "Goal id from `goalCardList`, for sharing conversion results."
  GOAL

  "Funnel id from `funnelList`, for sharing a funnel report."
  FUNNEL

  "Page id from `pageSpeedPages`, for sharing a speed report."
  PAGE_SPEED_REPORT

  "Site id from `sites`, for sharing site Web Analytics."
  WEB_ANALYTICS_SITE

  "Property id from `gaProperties`, for sharing imported analytics."
  WEB_ANALYTICS_GA_PROPERTY

  "Unrecognized stored resource type, for interpreting legacy results only."
  UNKNOWN
}

"Public lookup state saved by share-link update mutations."
enum SharedUrlStatus {
  "Public lookup enabled, while the resource and required subscription remain available."
  ENABLED

  "Public lookup disabled, while retaining the saved share link."
  DISABLED
}

"""
Named recordings filter returned by `playlistsList` or `savePlaylist`; recommended presets have negative ids and
