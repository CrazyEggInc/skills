  createdByUserName: String @deprecated(reason: "Use created_by_name instead")

  "Saved creator name; null when no creator name is recorded."
  createdByName: String
}

"""
Per-snapshot action availability returned with snapshot queries, accounting for session rights and snapshot
state.
"""
type SnapshotPermissions {
  """
  Whether recurrence can be turned on: needs edit rights and an automatic snapshot that is not an A/B test
  variant and is not completed or stopped.
  """
  canSetReoccurring: Boolean!

  "Whether recurrence can be disabled before completion or creation of a successor."
  canUnsetReoccurring: Boolean!

  "Whether the snapshot has visits or clicks available to view."
  canView: Boolean!

  "Whether the session can edit this snapshot; A/B test variants are excluded."
  canEdit: Boolean!

  "Whether a future start can be changed; recurring snapshots and those with successors are excluded."
  canEditStartDate: Boolean!

  """
  Whether `expiresAt` and `maxVisits` can be changed: needs edit rights, under three years of running time,
  visits below the account cap and no recurring successor.
  """
  canEditExpiration: Boolean!

  """
  Whether copying is available; manual captures, A/B test variants, recurring snapshots and those with
  successors are excluded.
  """
  canDuplicate: Boolean!

  "Whether automatic recapture is available for a non-manual snapshot in running or error state."
  canRefresh: Boolean!

  "Whether a stopped, unexpired snapshot has visits remaining and no variant or successor restriction."
  canResume: Boolean!

  "Whether the snapshot has data and no screenshot error; export capability requirements still apply."
  canExport: Boolean!

  """
  Whether the current session can pause a started active snapshot without variant or successor
  restrictions.
  """
  canPause: Boolean!
}

"""
Derived lifecycle states returned by snapshot queries; the first applicable state takes precedence in enum
order.
"""
enum SnapshotStatus {
  "Screenshot capture failed; takes precedence over every other state."
  ERROR

  "Active with a start time still in the future."
  SCHEDULED

  "Paused, expired or at its visit limit; collection has finished."
  COMPLETED

  "Active and collecting visits."
  RUNNING

  "Deleted snapshot that matches none of the states above."
  DELETED

  "None of the other states applies."
  UNKNOWN
}

"Screenshot or tracked-traffic device category used by snapshot operations."
enum SnapshotDevice {
  "Desktop screenshot or traffic, when targeting desktop visits."
  DESKTOP

  "Tablet screenshot or traffic, when targeting tablet visits."
  TABLET

  "Phone screenshot or traffic, when targeting phone visits."
  PHONE
}

"Expiration mode returned by snapshot queries."
enum SnapshotExpiredAtOption {
  "60-day span and 25000-visit limit, when identifying standard collection limits."
  DEFAULT

  "Non-default date or visit limits, when identifying customized collection limits."
  CUSTOM
}

"Stored start mode returned by snapshot queries."
enum SnapshotStartsAtOption {
  "A stored scheduled start, when a start time exists even if it is now in the past."
  SCHEDULED

  "No scheduled start, when collection uses creation time as its start."
  IMMEDIATELY
}

"Matching rule type inferred by snapshot queries."
enum SnapshotTrackingOption {
  "Normalized source URL matching without strict flags, for standard page tracking."
  DEFAULT

  "Source URL matching with at least one strict `MatchingRule` flag set."
  URL

  "Whole-URL wildcard pattern, for matching URL groups with `*`."
  WILDCARD

  "Regular-expression matching, for advanced URL patterns."
  REGEX

  "Page-name matching via `CE_SNAPSHOT_NAME`, for different pages that share one URL."
  NAMED

  "Legacy Google Optimize matching on an exact stored value."
  GOOGLE_OPTIMIZE
}

"Screenshot cleanup mode returned by snapshot queries."
enum SnapshotRemoveElementsOption {
  "No explicit cleanup rule, when capture has no popup or selector removal option."
  DEFAULT

  "Automatic popup removal, when capture hides popups."
  REMOVE_POPUPS

  "Plain CSS selector removal, when capture hides specified elements."
  REMOVE_ELEMENTS
}

"Share-link metadata returned by `sharedUrl`, `sharedUrls`, and share-link mutations."
type SharedUrlResult {
  "Share-link record id for update/regeneration mutations, distinct from the resource id."
  id: Int

  "Public share URL containing the code accepted by `sharedResource`."
  fullPath: String

  "Numeric resource id; null for string-keyed errors, surveys, and CTAs."
  itemId: Int

  "Resource id as a string, falling back to the numeric id; use with `itemType`."
  itemIdStr: ID

  "Resource type derived from the saved link; `UNKNOWN` for unrecognized types."
  itemType: SharedUrlType

  "Owner account id; can be null on legacy links."
  userId: Int

  """
  Site the link is scoped to; null for Heatmap, recording, and A/B test links, and the property id for Google
  Analytics property links.
  """
  siteId: Int

  "`ENABLED` unless the link was disabled; an enabled link still fails in `sharedResource` when its resource is gone."
  status: SharedUrlStatus

  "Saved management note; null when unset."
  note: String

  "Title captured from the shared resource when the link is created; null when unavailable."
  title: String

  "User who created the link; null for legacy links without a recorded sharer."
  sharedByUserId: Int

  "Recorded successful share lookups, incremented when at least one second has elapsed since the last counted lookup."
  totalViews: Int

  "Email of the user who created the link; set by `sharedUrls` and for existing links from `sharedUrl`, else null."
  sharedByUserEmail: String

  "Name of the user who created the link; set by `sharedUrls` and for existing links from `sharedUrl`, else null."
  sharedByUserName: String

  "Share-link creation time in Unix seconds."
  createdAt: Int

  "Last counted share lookup in Unix seconds; null before a counted lookup."
