}

"""
Recording summary for the current window returned by `dashboard`: watched and total counts plus a JSON-encoded
sample of recent unwatched sessions.
"""
type DashboardRecordings {
  "Recording count in the current window watched by the current guest."
  watched: Int!

  "Recording count in the current window."
  total: Int!

  "Currently an empty list."
  interesting: [InterestingRecording]!

  """
  JSON-encoded array of up to 70 recordings in the current window that the current guest has not watched and that
  last longer than 20 seconds. Each object has keys such as `recording_id` (the hashed ID accepted by `recording`),
  `first_page_url_normalized`, `duration` (seconds), `visited_pages_count`, `final_worth` (ten-thousandths of
  `currency`), `errors_count`, and `goal_conversion_count`.
