"""
Tracking rule details for `createSnapshots` and `updateSnapshot`; only fields selected by `trackingOption` are
used.
"""
input MatchingRule {
  "For `URL`, true requires the same protocol, such as `https`; false or omitted ignores protocol."
  strictProtocol: Boolean

  """
  For `URL`, true requires the exact hostname; false or omitted also matches host variants such as a
  leading `www.`.
  """
  strictHost: Boolean

  """
  For `URL`, true requires the exact path; false or omitted permits trailing slash and final
  index/default-page normalization.
  """
  strictPath: Boolean

  """
  For `URL`, true requires equal query parameters; false or omitted requires source parameters but permits
  extra parameters.
  """
  strictQuery: Boolean

  """
  For `URL`, true requires the same fragment; false or omitted ignores it only when the source has no
  fragment.
  """
  strictHash: Boolean

  """
  For `WILDCARD`, nonblank whole-URL pattern using `*`, for example `example.com/products/*`. An omitted
  protocol accepts HTTP or HTTPS; must differ from the source URL.
  """
  wildcard: String

  """
  For `REGEX`, regular expression such as `^https?://example[.]com/products/`; add anchors to constrain
  matches. Must be nonblank and differ from the source URL.
  """
  regex: String

  """
  For `NAMED`, the page name to match, normally the snapshot name. The page declares it with
  `var CE_SNAPSHOT_NAME = "...";` before the tracking script; `renameSnapshot` keeps the rule in sync.
  """
  named: String

  """
  For `GOOGLE_OPTIMIZE`, the legacy Google Optimize value to match exactly; no URL normalization is
  applied.
