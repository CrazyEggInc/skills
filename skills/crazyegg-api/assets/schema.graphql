"""
Dashboard response grouped into product-area sections. Each section is assembled independently
so clients can introspect which metrics are comparative pairs, static counts, or lazy follow-up
lookups.
"""
type Dashboard {
  visitors: DashboardVisitors!

  goals: DashboardGoals!

  snapshots: DashboardSnapshots!

  recordings: DashboardRecordings!

  abTests: DashboardAbTests!

  addons: DashboardAddons!

  "Currently an empty list."
  suggestions: [DashboardSuggestion]!
}

