}

"""
Snapshot counts split between currently active snapshots and snapshots that ended during the
requested window.
"""
type DashboardSnapshots {
  "Currently active, unexpired snapshots below their visit limit."
  active: Int!

  "Count of stopped snapshots whose stop time falls in the current window."
