  added in `excludeUrls` to get the next ones. With `query` this is URL and title autocomplete. The first
  request for an empty map runs a quick crawl (up to about 10 seconds) and queues a full crawl, so the answer
  is partial: while `PENDING`, repeat every 10 to 30 seconds, backing off, until `READY`; on `UNAVAILABLE`,
  retry after `retryAfterS` or stop when it is null. Pages seen only in Recordings, Web Analytics or Google
